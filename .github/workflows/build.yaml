# Builds on the home-cluster runners and pushes to the in-cluster registry.
# Public repo: never trigger on pull_request, or forks could run code on the cluster.
name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  image:
    runs-on: home-cluster
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          echo "version=$(sed -n 's/^\t*"version": "\(.*\)",$/\1/p' package.json)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: registry.lan.rockergaming.cloud
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: registry.lan.rockergaming.cloud/${{ github.repository }}
          # <run_number>-<sha7> is what Flux deploys (highest run number wins)
          tags: |
            type=raw,value=${{ github.run_number }}-{{sha}}
            type=sha,format=long
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=registry.lan.rockergaming.cloud/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=registry.lan.rockergaming.cloud/${{ github.repository }}:buildcache,mode=max
